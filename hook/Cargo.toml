[package]
name = "hook"
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# The hook is a Windows DLL (also loaded under Proton); on other hosts the crate is empty so
# `cargo test --workspace` works there.
[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
repak.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
fs-err.workspace = true
tracing.workspace = true
patternsleuth = { workspace = true, features = ["process-internal", "image-pe"] }
retour = { path = "../vendor/retour-rs", features = ["static-detour"] }
hook_resolvers = { path = "../hook_resolvers" }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
mint_lib = { path = "../mint_lib", default-features = false }
bitflags = "2.9.3"
widestring = "1.2.0"
tracing-appender = "0.2.3"
proxy_dll = { path = "../vendor/proxy_dll/proxy_dll" }
